version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskmanager-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskmanager-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taskmanager-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=production_super_secret_jwt_key_64_characters_long_min
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - taskmanager-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/v1
    container_name: taskmanager-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskmanager-network

volumes:
  mongo-data:

networks:
  taskmanager-network:
    driver: bridge
